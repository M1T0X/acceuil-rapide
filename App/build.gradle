plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.fast.home'
    compileSdk 34

    defaultConfig {
        applicationId 'com.fast.home'
        minSdk 22
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            debuggable false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}
